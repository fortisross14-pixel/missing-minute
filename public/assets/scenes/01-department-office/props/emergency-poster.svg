<svg xmlns="http://www.w3.org/2000/svg" width="210" height="300" viewBox="0 0 210 300">
    <defs>
      <filter id="rough"><feTurbulence baseFrequency=".012" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/></filter>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#81532f"/><stop offset="1" stop-color="#3d281d"/></linearGradient>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d27d"/><stop offset=".45" stop-color="#a86b28"/><stop offset="1" stop-color="#5d3617"/></linearGradient>
      <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3e7772"/><stop offset="1" stop-color="#153f40"/></linearGradient>
      <radialGradient id="glass"><stop stop-color="#d9f3ee" stop-opacity=".65"/><stop offset="1" stop-color="#5f9d9c" stop-opacity=".25"/></radialGradient>
    </defs>
<rect x="8" y="8" width="194" height="284" fill="#eadbb5" stroke="#4b2c1c" stroke-width="8" filter="url(#shadow)"/>
<rect x="20" y="20" width="170" height="48" fill="#8c2e29"/><text x="105" y="51" text-anchor="middle" font-family="Georgia" font-size="24" font-weight="bold" fill="#fff0c7">IN CASE OF FIRE</text>
<g font-family="Georgia" font-size="14" fill="#263f3b"><text x="26" y="94">1. Remain calm.</text><text x="26" y="122">2. Locate the fire.</text><text x="26" y="150">3. Check its appointment.</text><text x="26" y="178">4. Advance date one day.</text><text x="26" y="206">5. Evacuate alphabetically.</text></g>
<path d="M25 226H185" stroke="#9b6a39" stroke-width="3"/><text x="105" y="253" text-anchor="middle" font-family="Georgia" font-size="13" fill="#7d2925">TOMORROW MUST REMAIN</text><text x="105" y="272" text-anchor="middle" font-family="Georgia" font-size="13" fill="#7d2925">FULLY STAFFED</text>
</svg>